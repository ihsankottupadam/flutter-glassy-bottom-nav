name: glassy_bottom_nav
description: A frosted-glass bottom navigation bar with an animated selection indicator, per-item active colours and two layouts.
version: 1.0.0
homepage: https://github.com/ihsankottupadam/flutter-glassy-bottom-nav
repository: https://github.com/ihsankottupadam/flutter-glassy-bottom-nav
issue_tracker: https://github.com/ihsankottupadam/flutter-glassy-bottom-nav/issues

topics:
  - bottom-navigation
  - navigation-bar
  - glassmorphism
  - blur

screenshots:
  - description: 'The bar floating as a pill above the bottom edge'
    path: screenshots/centered.png
  - description: 'The bar docked to the bottom edge'
    path: screenshots/bottom.png
  - description: 'A center-docked action button over the bar'
    path: screenshots/docked_button.png

environment:
  # withValues and Color.a, used for the glass tint, arrived in Flutter 3.27.
  sdk: '>=3.6.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

